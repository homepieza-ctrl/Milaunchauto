              override fun onDraw(cv: Canvas) {
                  val w = width.toFloat(); val h = height.toFloat(); val u = minOf(w, h) / 100f
                  val ins = 7f * u; r.set(ins, ins, w - ins, h - ins); val rad = 20f * u
                  p.style = Paint.Style.STROKE
                  p.color = 0x1922D3FF; p.strokeWidth = 12f * u; cv.drawRoundRect(r, rad, rad, p)
                  p.color = 0x4022D3FF; p.strokeWidth = 6f * u; cv.drawRoundRect(r, rad, rad, p)
                  p.style = Paint.Style.FILL
                  p.shader = LinearGradient(0f, r.top, 0f, r.bottom, intArrayOf(0xFF0B1A4A.toInt(), 0xFF030A22.toInt()), null, Shader.TileMode.CLAMP)
                  cv.drawRoundRect(r, rad, rad, p); p.shader = null
                  icon?.let { d ->
                      if (full) {
                          val m = 3.2f * u; ri.set(r.left + m, r.top + m, r.right - m, r.bottom - m)
                          clip.reset(); clip.addRoundRect(ri, rad - m, rad - m, Path.Direction.CW)
                          cv.save(); cv.clipPath(clip); d.setBounds(ri.left.toInt(), ri.top.toInt(), ri.right.toInt(), ri.bottom.toInt()); d.draw(cv); cv.restore()
                      } else {
                          val m = 26f * u; d.setBounds((r.left + m).toInt(), (r.top + m * .9f).toInt(), (r.right - m).toInt(), (r.bottom - m * .9f).toInt()); d.draw(cv)
                      }
                  }
                  p.shader = LinearGradient(0f, r.top, 0f, r.bottom, intArrayOf(0x38FFFFFF, 0x00FFFFFF, 0x00000000, 0x50000000), null, Shader.TileMode.CLAMP)
                  cv.drawRoundRect(r, rad, rad, p); p.shader = null
                  p.style = Paint.Style.STROKE
                  p.color = 0xFF22D3FF.toInt(); p.strokeWidth = 2.8f * u; cv.drawRoundRect(r, rad, rad, p)
                  p.color = 0xFFE6FBFF.toInt(); p.strokeWidth = 1f * u; cv.drawRoundRect(r, rad, rad, p)
                  if (isPressed) {
                      p.style = Paint.Style.FILL; p.color = 0x77000000; cv.drawRoundRect(r, rad, rad, p)
                      p.style = Paint.Style.STROKE; p.color = 0xAA22D3FF.toInt(); p.strokeWidth = 5f * u; cv.drawRoundRect(r, rad, rad, p)
                  }
              }
          }
